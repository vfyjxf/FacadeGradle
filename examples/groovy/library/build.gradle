plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
            artifactId = 'example-library'
        }
    }
    repositories {
        maven {
            name = 'ExampleRepo'
            url = uri("${rootDir}/build/local-repo")
        }
    }
}
