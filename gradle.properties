org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Allow foojay resolver to download a JDK 21 on machines without a local one.
# The daemon itself still runs on whatever JVM launches gradlew (Java 25 here).
org.gradle.java.installations.auto-download=true
